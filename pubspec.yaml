name: fina
description: FINA - Aplikasi Manajemen Arus Kas Pribadi.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Local Database
  sqflite: ^2.3.2
  path: ^1.9.0
  
  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  
  # UI Helpers
  intl: ^0.19.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  flutter_markdown: ^0.7.7+1
  
  # OCR & Image Processing
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo_apps.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1A237E"
  image: assets/icon/logo_apps.png
  android_gravity: center
  ios_content_mode: center_aspect_fit
  web_image_mode: center
  android_12:
    image: assets/icon/logo_apps.png
    color: "#1A237E"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo_apps.png
