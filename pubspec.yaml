name: fina
description: FINA - Aplikasi Manajemen Arus Kas Pribadi.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Local Database
  sqflite: ^2.3.2
  path: ^1.9.0
  
  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_timezone: ^5.0.0
  
  # UI Helpers
  intl: ^0.19.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  flutter_markdown: ^0.7.7+1
  http: ^1.2.1
  
  # Firebase & Social
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.1
  google_sign_in: ^6.2.1
  
  # QR Sharing
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  
  # OCR & Image Processing
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  flutter_launcher_icons: ^0.13.1
  home_widget: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo_apps.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo_apps.png
    - assets/icon/sunflower_cheerful.png
    - assets/icon/sunflower_withered.png
